<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture Pad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --stage: #f4f4f5;
  --dot: #d4d4d8;
  --fg: #09090b;
  --muted: #71717a;
  --muted-bg: #f4f4f5;
  --border: #e4e4e7;
  --ring: #a1a1aa;
  --primary: #18181b;
  --primary-fg: #fafafa;
  --signal: #16a34a;
  --signal-soft: rgba(22, 163, 74, .14);
  --signal-glow: rgba(22, 163, 74, .5);
  --amber: #d97706;
  --amber-soft: rgba(217, 119, 6, .14);
  --red: #dc2626;
  --led: #3b82f6;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r: 8px;
  --r-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --stage: #0f0f12;
    --dot: #27272a;
    --fg: #fafafa;
    --muted: #a1a1aa;
    --muted-bg: #18181b;
    --border: #27272a;
    --ring: #52525b;
    --primary: #fafafa;
    --primary-fg: #18181b;
    --signal: #22c55e;
    --signal-soft: rgba(34, 197, 94, .14);
    --signal-glow: rgba(34, 197, 94, .55);
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, .14);
    --red: #ef4444;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- buttons (shadcn-ish) ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 12px;
  border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--bg);
  font-weight: 500; font-size: 13.5px;
  white-space: nowrap;
  transition: background .12s, border-color .12s, opacity .12s;
}
.btn:hover { background: var(--muted-bg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.primary:hover { opacity: .9; background: var(--primary); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--muted-bg); }
.btn.danger { color: #fff; background: var(--red); border-color: var(--red); }
.btn svg { width: 15px; height: 15px; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  height: 56px; padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky; top: 0; z-index: 20;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.logo-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--primary); display: grid; place-items: center; }
.logo-mark i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary-fg); transition: background .15s, box-shadow .15s; }
.logo-mark i.on { background: var(--led); box-shadow: 0 0 8px 2px var(--led); }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 26px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--muted); font-size: 12.5px;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ring); }
.pill.on i { background: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
.pill.demo i { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.spacer { flex: 1; }
.save-note { color: var(--muted); font-size: 12.5px; margin-right: 4px; }
.save-note.dirty { color: var(--amber); }
.sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

.notice {
  margin: 12px 20px 0; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: var(--r); background: var(--muted-bg); font-size: 13px;
}

/* ---------- stage (upper) ---------- */
.stage {
  position: relative;
  background-color: var(--stage);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 18px 18px;
  border-bottom: 1px solid var(--border);
  padding: 40px 20px 36px;
  display: grid;
  grid-template-columns: minmax(170px, 230px) minmax(300px, 430px) minmax(170px, 230px);
  justify-content: center;
  align-items: center;
  gap: 56px;
}
.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.links path { fill: none; stroke: var(--ring); stroke-width: 1.25; stroke-dasharray: 3 4; opacity: .7; transition: stroke .2s, opacity .2s; }
.links path.sel { stroke: var(--fg); opacity: 1; stroke-dasharray: none; }
.links path.fire { stroke: var(--signal); opacity: 1; stroke-dasharray: none; stroke-width: 2; }

.rail { display: grid; gap: 10px; position: relative; z-index: 1; }
.rail-title { font-size: 12px; color: var(--muted); font-weight: 500; padding-left: 2px; }
.gtile {
  display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center;
  width: 100%; text-align: left;
  padding: 8px 10px 8px 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  transition: border-color .12s, box-shadow .2s, transform .1s;
}
.gtile:hover { border-color: var(--ring); }
.gtile.sel { border-color: var(--fg); box-shadow: 0 0 0 3px rgba(113,113,122,.18); }
.gtile .gi {
  width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center;
  background: var(--muted-bg); color: var(--fg); transition: background .2s, color .2s;
}
.gtile .gi svg { width: 20px; height: 20px; }
.gtile .gn { font-weight: 500; font-size: 13.5px; line-height: 1.25; }
.gtile .gb { color: var(--muted); font-size: 12.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gtile.fire { border-color: var(--signal); animation: tile-breathe 1.4s ease-in-out 1; }
.gtile.fire .gi, .gtile.hold .gi { background: var(--signal); color: #fff; }
.gtile.hold { border-color: var(--signal); animation: tile-breathe 1.8s ease-in-out infinite; }
@keyframes tile-breathe {
  0%, 100% { box-shadow: 0 0 0 0 var(--signal-soft); }
  50% { box-shadow: 0 0 0 6px var(--signal-soft), 0 0 22px 2px var(--signal-glow); }
}
.rail-empty { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--ring); border-radius: var(--r-lg); padding: 12px; line-height: 1.45; background: var(--bg); }

/* ---------- the board ---------- */
.board-wrap { position: relative; z-index: 1; padding-top: 4%; }
.board {
  position: relative;
  width: 100%;
  aspect-ratio: 840 / 905;
  container-type: inline-size;
}
.pcb { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 24px rgba(0,0,0,.16)) drop-shadow(0 2px 3px rgba(0,0,0,.12)); }
.part {
  position: absolute; padding: 0; border: 0; background: none;
  border-radius: 8px;
}
.part:focus-visible { outline-offset: 4px; }
.part .hl {
  position: absolute; inset: -6px; border-radius: 14px; pointer-events: none;
  box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s;
}
.part:hover .hl { box-shadow: 0 0 0 2px rgba(113,113,122,.45); }
.part.sel .hl { box-shadow: 0 0 0 2.5px var(--fg); }
@media (prefers-color-scheme: dark) { .part.sel .hl { box-shadow: 0 0 0 2.5px #fafafa; } }

/* keycaps */
.cap { display: block; width: 100%; height: 100%; position: relative; }
.cap-body, .cap-dish, .part .hl { display: block; }
.cap-body {
  position: absolute; inset: 0;
  border-radius: 16% / 16%;
  background: linear-gradient(180deg, #f1f0ec 0%, #e6e4df 55%, #d9d7d1 100%);
  box-shadow:
    inset 0 -6cqw 0 -3cqw rgba(0,0,0,.05),
    0 1.2cqw 0 #c9c6bf,
    0 2cqw 2.4cqw rgba(0,0,0,.22);
  transition: transform .06s, box-shadow .06s;
}
.cap-dish {
  position: absolute; left: 9%; right: 9%; top: 7%; bottom: 13%;
  border-radius: 50% / 48%;
  background: radial-gradient(ellipse at 50% 38%, #fbfaf7 0%, #f1efea 55%, #e2e0da 100%);
  box-shadow: inset 0 0.5cqw 1.2cqw rgba(0,0,0,.08), inset 0 -0.4cqw 0.6cqw rgba(255,255,255,.7);
  display: grid; place-items: center; padding: 10%;
}
.legend {
  color: #3f3f46; text-align: center; font-weight: 600;
  font-size: clamp(9px, 3.1cqw, 15px); line-height: 1.15; overflow-wrap: anywhere;
}
.legend small { display: block; font-weight: 500; color: #8a8a93; font-size: .8em; margin-top: 2px; }
.legend.none { color: #a8a8b0; font-weight: 500; }
.part.k.hit .cap-body { transform: translateY(1cqw); box-shadow: inset 0 -6cqw 0 -3cqw rgba(0,0,0,.05), 0 .3cqw 0 #c9c6bf, 0 .8cqw 1.2cqw rgba(0,0,0,.2); }
.part.k.hit .cap-dish { transform: translateY(1cqw); }

/* knob */
.knob-wrap { position: absolute; }
.encoder-base {
  position: absolute; border-radius: 3%;
  background: linear-gradient(135deg, #2c4a3e, #1e3a30);
  box-shadow: 0 1px 2px rgba(0,0,0,.4);
}
.knob {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0 60%, rgba(0,0,0,.05) 61%),
    repeating-conic-gradient(from 0deg, #c9c9cc 0deg 2deg, #a7a7ab 2deg 4deg);
  box-shadow: 0 1.6cqw 2.8cqw rgba(0,0,0,.35), inset 0 0 0 .4cqw rgba(255,255,255,.35);
  transition: transform .18s ease-out;
}
.knob-top {
  position: absolute; inset: 7%; border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%),
    radial-gradient(circle, #d6d6d9, #b9b9bd);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.knob-top::after {
  /* sparkle texture like the photo */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background-image: radial-gradient(rgba(255,255,255,.6) .5px, transparent .8px), radial-gradient(rgba(0,0,0,.12) .5px, transparent .8px);
  background-size: 5px 5px, 7px 7px; background-position: 0 0, 2px 3px; opacity: .6;
}
.knob-label {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-size: clamp(8px, 2.4cqw, 12px); color: #52525b; font-weight: 600; line-height: 1.2; padding: 22%;
  pointer-events: none;
}
.knob-label small { display: block; font-weight: 500; color: #71717a; }
.knob-arrow {
  position: absolute; top: 50%; width: 15%; aspect-ratio: 1; transform: translateY(-50%);
  border-radius: 50%; border: 0; display: grid; place-items: center;
  background: rgba(24,24,27,.82); color: #fff; opacity: 0; transition: opacity .15s;
  font-size: clamp(9px, 2.6cqw, 14px); line-height: 1;
}
.knob-wrap:hover .knob-arrow, .knob-wrap.sel .knob-arrow { opacity: 1; }
.knob-arrow.l { left: -9%; } .knob-arrow.r { right: -9%; }
.knob-arrow.sel { background: var(--signal); }
.knob-wrap.hit .knob { box-shadow: 0 .8cqw 1.4cqw rgba(0,0,0,.35), inset 0 0 0 .4cqw rgba(255,255,255,.35); }

/* status LED on the board */
.board-led { position: absolute; width: 2.2%; aspect-ratio: 1; border-radius: 50%; background: #9db4d8; box-shadow: 0 0 0 1px rgba(0,0,0,.25); transition: background .1s, box-shadow .1s; pointer-events: none; }
.board-led.on { background: #60a5fa; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 0 10px 4px rgba(59,130,246,.75); }

/* camera glow when a gesture fires */
.lens-glow { position: absolute; border-radius: 50%; pointer-events: none; transition: box-shadow .3s; }
.lens-glow.fire { animation: lens 1.4s ease-in-out 1; }
.lens-glow.hold { animation: lens 1.8s ease-in-out infinite; }
@keyframes lens { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px var(--signal-soft), 0 0 26px 8px var(--signal-glow); } }

.part-tag {
  position: absolute; white-space: nowrap; font-size: 11.5px; color: var(--muted);
  pointer-events: none; transform: translateX(-50%);
}

/* ---------- bottom panel ---------- */
.panel-wrap { padding: 0 20px 64px; }
.panel { max-width: 1240px; margin: 0 auto; }
.phead {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 0 14px; border-bottom: 1px solid var(--border);
}
.phead-ico { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); display: grid; place-items: center; }
.phead-ico svg { width: 20px; height: 20px; }
.phead h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.phead .sub { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.phead .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
kbd {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px;
  background: var(--bg); color: var(--fg);
}
.seg { display: inline-flex; padding: 3px; border-radius: var(--r); background: var(--muted-bg); gap: 2px; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 500; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
.seg button:hover { color: var(--fg); }

.pbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 18px; }
.pbody.split { grid-template-columns: minmax(0, 1fr) 340px; }
.section-title { font-size: 13px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title .hint { font-weight: 400; color: var(--muted); }
.card { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; background: var(--bg); }
.stack { display: grid; gap: 16px; align-content: start; }

/* VIA-style keycode picker */
.picker { container-type: inline-size; }
.kb { --u: calc((100cqw - 2px) / 18.75); display: grid; gap: calc(var(--u) * .1); }
.kb-row { display: flex; gap: 0; }
.kc {
  height: calc(var(--u) * .92); width: calc(var(--u) * var(--w, 1) - 4px); margin: 0 2px;
  border-radius: 6px; border: 1px solid var(--border); border-bottom-width: 2px;
  background: var(--bg); font-size: clamp(9px, calc(var(--u) * .27), 12.5px); font-weight: 500;
  display: flex; align-items: center; justify-content: center; padding: 0 4px; line-height: 1.1;
  transition: background .1s, border-color .1s, transform .05s; color: var(--fg); text-align: center;
}
.kc:hover { background: var(--muted-bg); border-color: var(--ring); }
.kc:active { transform: translateY(1px); }
.kc.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.kc.mod.on { background: var(--led); border-color: var(--led); color: #fff; }
.kc.gap { visibility: hidden; }
.kc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.kc-grid .kc { width: auto; height: 52px; margin: 0; font-size: 13px; flex-direction: column; gap: 3px; }
.kc-grid .kc svg { width: 16px; height: 16px; }
.kc-grid.small { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
.kc-grid.small .kc { height: 38px; }
details.more { margin-top: 16px; }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); padding: 4px 0; }
details.more summary:hover { color: var(--fg); }
details.more .kc-grid { margin-top: 10px; }
.subtle { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; line-height: 1.5; }

.modes { display: grid; gap: 8px; }
.mode-opt { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; }
.mode-opt:has(input:checked) { border-color: var(--fg); }
.mode-opt input { margin: 3px 0 0; accent-color: var(--fg); }
.mode-opt b { display: block; font-weight: 500; font-size: 13.5px; }
.mode-opt small { color: var(--muted); font-size: 12.5px; }

/* sliders */
.sliders { display: grid; gap: 14px; }
.slider label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.slider label span { font-weight: 500; }
.slider output { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.slider p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(var(--primary), var(--primary)) 0 / var(--p, 50%) 100% no-repeat, var(--muted-bg); border: 1px solid var(--border); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--primary); margin-top: -6px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--muted-bg); border: 1px solid var(--border); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--primary); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--primary); }
.switch { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; margin: 0; transition: background .15s; cursor: pointer; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked { background: var(--primary); }
.switch input:checked::after { transform: translateX(14px); }
@media (prefers-color-scheme: dark) { .switch input:checked::after { background: #18181b; } }
.switch span b { font-weight: 500; display: block; }
.switch small { color: var(--muted); font-size: 12px; }

/* meters */
.meter { margin-bottom: 12px; }
.meter:last-child { margin-bottom: 0; }
.meter-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
.meter-top span:last-child { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--muted-bg); border: 1px solid var(--border); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; width: 0; background: var(--ring); transition: width .1s linear; }
.bar .fill.ok { background: var(--signal); }
.bar .fill.warn { background: var(--amber); }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--fg); }
.bar .mark.soft { background: var(--ring); }

/* live camera */
.feed {
  position: relative; border-radius: var(--r-lg); background: #0a0a0b; aspect-ratio: 4 / 3; overflow: visible;
  box-shadow: 0 0 0 1px var(--border);
}
.feed canvas { width: 100%; height: 100%; display: block; border-radius: var(--r-lg); }
.feed.fire { animation: breathe 1.5s ease-in-out 1; }
.feed.hold { animation: breathe-loop 1.8s ease-in-out infinite; }
.feed.reject { animation: warn .8s ease-out 1; }
.feed::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); pointer-events: none; }
.feed.fire::after { animation: breathe-in 1.5s ease-in-out 1; }
.feed.hold::after { animation: breathe-in-loop 1.8s ease-in-out infinite; }
@keyframes breathe { 0%,100% { box-shadow: 0 0 0 1px var(--border); } 22%,66% { box-shadow: 0 0 0 3px var(--signal), 0 0 40px 6px var(--signal-glow); } 44% { box-shadow: 0 0 0 2px var(--signal), 0 0 14px 2px var(--signal-glow); } }
@keyframes breathe-in { 0%,100% { box-shadow: inset 0 0 0 0 transparent; } 22%,66% { box-shadow: inset 0 0 56px 6px var(--signal-glow); } 44% { box-shadow: inset 0 0 18px 0 var(--signal-glow); } }
@keyframes breathe-loop { 0%,100% { box-shadow: 0 0 0 2px var(--signal), 0 0 14px 2px var(--signal-glow); } 50% { box-shadow: 0 0 0 3px var(--signal), 0 0 46px 10px var(--signal-glow); } }
@keyframes breathe-in-loop { 0%,100% { box-shadow: inset 0 0 18px 0 var(--signal-glow); } 50% { box-shadow: inset 0 0 66px 8px var(--signal-glow); } }
@keyframes warn { 0% { box-shadow: 0 0 0 3px var(--amber), 0 0 28px 4px var(--amber-soft); } 100% { box-shadow: 0 0 0 1px var(--border); } }
.feed-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #a1a1aa; padding: 24px; font-size: 13.5px; }
.feed-empty b { display: block; color: #fafafa; font-weight: 500; font-size: 15px; margin-bottom: 4px; }
.badge {
  position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px 10px 10px; border-radius: 12px;
  background: rgba(9,9,11,.78); color: #fafafa; border: 1px solid rgba(34,197,94,.5);
  backdrop-filter: blur(8px); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none;
}
.badge.show { opacity: 1; transform: none; }
.badge .bi { width: 44px; height: 44px; border-radius: 10px; background: #22c55e; color: #052e16; display: grid; place-items: center; }
.badge .bi svg { width: 26px; height: 26px; }
.badge .bn { font-weight: 600; font-size: 15px; }
.badge .ba { font-size: 13px; color: #a1a1aa; }
.reject-msg {
  position: absolute; right: 12px; top: 12px; max-width: 75%;
  background: rgba(9,9,11,.82); color: #fde68a; border: 1px solid rgba(245,158,11,.6);
  padding: 7px 11px; border-radius: 8px; font-size: 12.5px; opacity: 0; transition: opacity .25s; pointer-events: none;
}
.reject-msg.show { opacity: 1; }
.readouts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 12px; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.readout { padding: 9px 12px; border-left: 1px solid var(--border); min-width: 0; }
.readout:first-child { border-left: 0; }
.readout .rl { font-size: 11.5px; color: var(--muted); }
.readout .rv { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.readout .rv small { font-size: 12px; font-weight: 400; color: var(--muted); }
.sim { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.sim span { color: var(--muted); font-size: 12.5px; margin-right: 2px; }

.legend-row i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

.log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; font-size: 13px; }

.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 1px; }
.log .g { color: var(--signal); font-weight: 500; }
.log .r { color: var(--amber); font-weight: 500; }
.empty { color: var(--muted); font-size: 13px; }

.cap-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.input, select.input {
  height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); min-width: 0;
}
.cap-count { font-size: 12.5px; color: var(--muted); }

.btn.rec { background: var(--red); border-color: var(--red); color: #fff; }
.btn.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

.ld-card ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }

  position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
  background: var(--primary); color: var(--primary-fg); padding: 9px 14px; border-radius: var(--r); font-size: 13px;
  transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .feed.fire, .feed.hold, .feed.fire::after, .feed.hold::after, .gtile.fire, .gtile.hold, .lens-glow.fire, .lens-glow.hold { animation: none; }

}

}
@media (max-width: 900px) {

}

function actionParts(a) {
  if (!a || a.t === "none") return null;
  if (a.t === "key") {
    const p = MODS.filter(m => a.m & (1 << m.bit)).map(m => m.short);
    if (a.c) p.push(KEY_BY_USAGE[a.c]?.label ?? "0x" + a.c.toString(16));
    return p.length ? p : null;
  }
  if (a.t === "media") return [MEDIA_NAME[a.c] ?? "Media 0x" + a.c.toString(16)];
  if (a.t === "mouse") return [MOUSE_NAME[a.c] ?? "Mouse"];
  if (a.t === "wheel") return [`Scroll ${a.c > 0 ? "up" : "down"} ${Math.abs(a.c)}`];
  return null;
}
const actionLabel = a => actionParts(a)?.join(" + ") ?? "Nothing";
const actionKbd = a => {
  const p = actionParts(a);
  if (!p) return `<span>Nothing assigned</span>`;
  return a.t === "key" ? p.map(x => `<kbd>${esc(x)}</kbd>`).join("<span>+</span>") : `<kbd>${esc(p[0])}</kbd>`;
};
function legendHtml(a) {
  const p = actionParts(a);
  if (!p) return `<span class="legend none">—</span>`;
  if (a.t === "key" && p.length > 1) return `<span class="legend">${esc(p[p.length - 1])}<small>${esc(p.slice(0, -1).join("+"))}</small></span>`;
  return `<span class="legend">${esc(p.join(" + "))}</span>`;
}

function renderRails() {

    : `<div class="rail-empty">Connect the pad to load the poses its model knows. Retrain with new labels and they show up here.</div>`);

function drawLinks() {
  const stage = $("stage"), svgEl = $("links"), glow = $("lensGlow");
  if (!glow || getComputedStyle(svgEl).display === "none") return;
  const sr = stage.getBoundingClientRect(), gr = glow.getBoundingClientRect();
  const lx = gr.left + gr.width / 2 - sr.left, ly = gr.top + gr.height / 2 - sr.top;
  let paths = "";
  document.querySelectorAll(".gtile").forEach(t => {
    const r = t.getBoundingClientRect();
    const left = r.left + r.width / 2 < gr.left;
    const x = (left ? r.right : r.left) - sr.left, y = r.top + r.height / 2 - sr.top;
    const cx = (x + lx) / 2;
    const id = t.dataset.input;
    const cls = t.classList.contains("fire") || t.classList.contains("hold") ? "fire" : selected === id ? "sel" : "";
    paths += `<path class="${cls}" data-link="${id}" d="M${x},${y} C${cx},${y} ${cx},${ly} ${lx},${ly}"/>`;
  });
  svgEl.setAttribute("viewBox", `0 0 ${sr.width} ${sr.height}`);
  svgEl.innerHTML = paths;
}
new ResizeObserver(() => drawLinks()).observe(document.body);

/* ===================================================================

   =================================================================== */
function currentInput() {
  if (selected === "knob") return knobSub;
  return INPUTS[selected] ? selected : null;
}

function renderPanel() {
  const p = $("panel");
  recordingKeys = false;
  if (selected === "camera") return renderCameraPanel(p);
  if (selected === "tof") return renderTofPanel(p);
  if (selected === "ld") return renderLdPanel(p);
  const id = currentInput();
  const info = INPUTS[id], a = cfg.map[id] || { t: "none", m: 0, c: 0, mode: "tap" };
  const isKnob = selected === "knob";
  const gesture = info.gesture;

  const head = `
    <div class="phead">
      <span class="phead-ico">${ICONS[info.icon]}</span>
      <div><h2>${isKnob ? "Knob" : esc(info.name)}</h2><div class="sub">${gesture ? esc(info.desc) + ", sends" : "Sends"} ${actionKbd(a)}</div></div>
      <div class="actions">
        ${isKnob ? `<div class="seg" role="group" aria-label="Knob action">
          ${[["enc_ccw", "Turn left"], ["enc_push", "Press"], ["enc_cw", "Turn right"]].map(([k, l]) => `<button data-knobsub="${k}" aria-pressed="${knobSub === k}">${l}</button>`).join("")}</div>` : ""}
        <button class="btn sm" id="btnRecord">${recordingKeys ? "Press keys…" : "Record shortcut"}</button>
        <button class="btn sm ghost" id="btnClear">Clear</button>
      </div>
    </div>`;

  const tab = pickerTab?.[id] ?? (a.t === "none" ? "key" : a.t);
  const tabs = [["key", "Keyboard"], ["media", "Media"], ["mouse", "Mouse"], ["wheel", "Scroll"]];
  const picker = `
    <div class="seg" role="tablist" style="margin-bottom:14px">${tabs.map(([t, l]) => `<button data-ptab="${t}" aria-pressed="${tab === t}">${l}</button>`).join("")}</div>
    <div class="picker">${pickerBody(tab, a)}</div>`;

  const modes = modesOf(id);
  const behaviour = modes.length > 1 && a.t !== "wheel" ? `
    <div><div class="section-title">Behaviour</div><div class="modes">${modes.map(m => `
      <label class="mode-opt"><input type="radio" name="mode" value="${m}" ${a.mode === m ? "checked" : ""}>
        <span><b>${MODE_INFO[m][0]}</b><small>${MODE_INFO[m][1]}</small></span></label>`).join("")}</div></div>` : "";

  let side = behaviour;
  if (id === "palm") side += tuneCard("Detection", ["palmDark", "palmExit", "palmHoldMs", "cooldownMs"], gateMetersHtml(["ratio"]));
  else if (id === "swipe_lr" || id === "swipe_rl") side += tuneCard("Detection", ["swipeTravel", "swipeMaxMs", "confOn", "trackCov", "mirror", "cooldownMs"], gateMetersHtml(["close", "cov", "conf"]));
  else if (info.gesture === "pose") side += tuneCard("Recognition", ["mlOn", "mlThr", "mlFrames", "mlRelease", "mlCooldownMs", "mlMaxDist"], modelBarsHtml());
  else if (isKnob) side += tuneCard("Knob", ["encSteps", "encReverse"]);

  p.innerHTML = head + `<div class="pbody${side ? " split" : ""}"><div>${picker}</div>${side ? `<div class="stack">${side}</div>` : ""}</div>`;
  if (side) updateRangeFills(p);
  if (lastTel) applyTelemetry(lastTel);
}

function pickerBody(tab, a) {
  if (tab === "key") {
    const isKey = a.t === "key";
    const kc = it => {
      if (it.gap !== undefined) return `<span class="kc gap" style="--w:${it.gap}"></span>`;
      const [label, val, w = 1] = it;
      if (typeof val === "object") {
        const on = isKey && (a.m & (1 << val.mod));
        return `<button class="kc mod${on ? " on" : ""}" data-mod="${val.mod}" style="--w:${w}" title="${MODS[val.mod].short}">${label}</button>`;
      }
      return `<button class="kc${isKey && a.c === val ? " on" : ""}" data-key="${val}" style="--w:${w}">${esc(label)}</button>`;
    };
    return `<div class="kb">${LAYOUT.map((row, i) => `<div class="kb-row"${i === 0 ? ' style="margin-bottom:calc(var(--u)*.2)"' : ""}>${row.map(kc).join("")}</div>`).join("")}</div>
      <details class="more"${MORE_KEYS.some(k => isKey && a.c === k.usage) ? " open" : ""}><summary>F13–F24, numpad and more</summary>
        <div class="kc-grid small">${MORE_KEYS.map(k => `<button class="kc${isKey && a.c === k.usage ? " on" : ""}" data-key="${k.usage}">${esc(k.label)}</button>`).join("")}</div></details>
      <p class="subtle">Click modifiers to toggle them, then pick a key. Combos Windows keeps for itself (like Win + L or Alt + Tab) can’t be recorded, so build them here.</p>`;
  }
  if (tab === "media") return `<div class="kc-grid">${MEDIA.map(([c, l, ic]) => `<button class="kc${a.t === "media" && a.c === c ? " on" : ""}" data-media="${c}">${ICONS[ic] || ""}<span>${l}</span></button>`).join("")}</div>
    <p class="subtle">Mute silences your speakers. To mute your mic in a call, use the app’s shortcut instead, like Ctrl + Shift + M in Teams, or Win + Alt + K on Windows 11.</p>`;
  if (tab === "mouse") return `<div class="kc-grid">${MOUSE.map(([c, l]) => `<button class="kc${a.t === "mouse" && a.c === c ? " on" : ""}" data-mouse="${c}">${ICONS.mouse}<span>${l}</span></button>`).join("")}</div>
    <p class="subtle">The back button works as “back” in browsers and File Explorer.</p>`;
  const up = a.t !== "wheel" || a.c > 0, amt = a.t === "wheel" ? Math.abs(a.c) : 3;
  return `<div class="kc-grid" style="max-width:420px">
      <button class="kc${a.t === "wheel" && up ? " on" : ""}" data-wheel="up">${ICONS.scroll}<span>Scroll up</span></button>
      <button class="kc${a.t === "wheel" && !up ? " on" : ""}" data-wheel="down">${ICONS.scroll}<span>Scroll down</span></button></div>
    <div class="slider" style="max-width:420px;margin-top:16px"><label for="wheelAmt"><span>Lines per step</span><output id="wheelOut">${amt}</output></label>
      <input type="range" id="wheelAmt" min="1" max="10" step="1" value="${amt}"></div>`;
}

function fmtTune(k, v) {
  const it = TUNE[k];
  if (it.zero && v == 0) return it.zero;
  if (it.unit === "%") return Math.round(v * 100) + "%";
  if (it.unit === "×") return (+v).toFixed(2) + "×";
  if (it.step < 1) return (+v).toFixed(2);
  return v + (it.unit ? " " + it.unit : "");
}
function tuneCard(title, keys, extra = "") {
  return `<div class="card"><div class="section-title">${title}</div>${extra ? `<div style="margin-bottom:16px">${extra}</div>` : ""}<div class="sliders">${keys.map(tuneControl).join("")}</div></div>`;
}
function tuneControl(k) {
  const it = TUNE[k], v = cfg.tune[k];
  if (it.toggle) return `<label class="switch"><input type="checkbox" data-tune="${k}" ${v ? "checked" : ""}><span><b>${it.label}</b>${it.help ? `<small>${it.help}</small>` : ""}</span></label>`;
  return `<div class="slider"><label for="t_${k}"><span>${it.label}</span><output id="o_${k}">${fmtTune(k, v)}</output></label>
    <input type="range" id="t_${k}" data-tune="${k}" min="${it.min}" max="${it.max}" step="${it.step}" value="${v}">${it.help ? `<p>${it.help}</p>` : ""}</div>`;
}
function updateRangeFills(root = document) {
  root.querySelectorAll('input[type=range]').forEach(r => r.style.setProperty("--p", ((r.value - r.min) / (r.max - r.min) * 100) + "%"));
}

   =================================================================== */
function select(sel, sub) {
  selected = sel;
  if (sub) knobSub = sub;
  renderBoard(); renderRails(); renderPanel();
  syncStream();
}

function updateAction(changes) {
  const id = currentInput();
  if (!id) return;
  const a = cfg.map[id] = { ...(cfg.map[id] || { t: "none", m: 0, c: 0, mode: "tap" }), ...changes };
  if (!modesOf(id).includes(a.mode)) a.mode = modesOf(id)[0];
  if (a.t === "key" && !a.m && !a.c) a.t = "none";
  markDirty();
  send({ cmd: "set_config", config: { map: { [id]: a } } });
  renderBoard(); renderRails(); renderPanel();
}

document.addEventListener("click", e => {
  const knobBtn = e.target.closest("[data-knob]");
  if (knobBtn) return select("knob", knobBtn.dataset.knob);
  const sel = e.target.closest("[data-sel]");
  if (sel) return select(sel.dataset.sel);
  const ks = e.target.closest("[data-knobsub]");
  if (ks) return select("knob", ks.dataset.knobsub);

  const id = currentInput();
  const pt = e.target.closest("[data-ptab]");
  if (pt && id) { pickerTab = { ...(pickerTab || {}), [id]: pt.dataset.ptab }; return renderPanel(); }
  const cur = id ? cfg.map[id] : null;
  const mod = e.target.closest("[data-mod]");
  if (mod) { const m = (cur?.t === "key" ? cur.m : 0) ^ (1 << +mod.dataset.mod); return updateAction({ t: "key", m, c: cur?.t === "key" ? cur.c : 0 }); }
  const key = e.target.closest("[data-key]");
  if (key) return updateAction({ t: "key", m: cur?.t === "key" ? cur.m : 0, c: +key.dataset.key });
  const media = e.target.closest("[data-media]");
  if (media) return updateAction({ t: "media", m: 0, c: +media.dataset.media });
  const mouse = e.target.closest("[data-mouse]");
  if (mouse) return updateAction({ t: "mouse", m: 0, c: +mouse.dataset.mouse });
  const wh = e.target.closest("[data-wheel]");
  if (wh) { const amt = cur?.t === "wheel" ? Math.abs(cur.c) : 3; return updateAction({ t: "wheel", m: 0, c: wh.dataset.wheel === "up" ? amt : -amt }); }

  if (e.target.closest("#btnClear")) return updateAction({ t: "none", m: 0, c: 0 });
  if (e.target.closest("#btnRecord")) {
    recordingKeys = !recordingKeys;
    const b = $("btnRecord");
    b.textContent = recordingKeys ? "Press keys…" : "Record shortcut";
    b.classList.toggle("rec", recordingKeys);
    return;
  }
  if (e.target.closest("#btnClearLog")) { events.length = 0; return renderLog(); }
  const sim = e.target.closest("[data-sim]");
  if (sim && demo) return demo.simulate(sim.dataset.sim);
  if (e.target.closest("#btnRec")) return toggleCapture();
  if (e.target.closest("#btnCapZip")) return downloadCapture();
  if (e.target.closest("#btnCapClear")) { capture.frames = []; capture.counts = {}; return renderCapture(); }
});

  if (e.target.name === "mode") updateAction({ mode: e.target.value });
  if (e.target.id === "wheelAmt") { const c = cfg.map[currentInput()]; const s = c?.t === "wheel" && c.c < 0 ? -1 : 1; updateAction({ t: "wheel", m: 0, c: s * +e.target.value }); }
  if (e.target.id === "capLabel") capture.label = sanitizeLabel(e.target.value) || "none";
  if (e.target.id === "capEvery") capture.every = +e.target.value;
});

let tuneTimer = null, tunePending = {};
document.addEventListener("input", e => {
  if (e.target.id === "wheelAmt") { $("wheelOut").textContent = e.target.value; updateRangeFills(e.target.parentElement); }
  const k = e.target.dataset?.tune;
  if (!k) return;
  const it = TUNE[k];
  const v = it.toggle ? (e.target.checked ? 1 : 0) : +e.target.value;
  cfg.tune[k] = v;
  document.querySelectorAll(`#o_${k}`).forEach(o => o.textContent = fmtTune(k, v));
  if (!it.toggle) e.target.style.setProperty("--p", ((v - it.min) / (it.max - it.min) * 100) + "%");
  tunePending[k] = v;
  markDirty();
  updateMarks();
  if (k.startsWith("tof")) drawTofGraph();
  clearTimeout(tuneTimer);
  tuneTimer = setTimeout(() => { send({ cmd: "set_config", config: { tune: tunePending } }); tunePending = {}; }, 120);
});

window.addEventListener("keydown", e => {
  if (!recordingKeys) return;
  e.preventDefault();
  if (e.code in MOD_BY_CODE) return;
  const k = KEY_BY_CODE[e.code];
  if (!k) return;
  let m = 0;
  if (e.ctrlKey) m |= 1; if (e.shiftKey) m |= 2; if (e.altKey) m |= 4; if (e.metaKey) m |= 8;
  recordingKeys = false;
  updateAction({ t: "key", m, c: k.usage });
});

/* ===================================================================
   Transport (WebSerial)
   =================================================================== */
const enc = new TextEncoder(), dec = new TextDecoder();
async function send(obj) {
  if (mode === "demo") return demo.handle(obj);
  if (mode !== "serial" || !writer) return;
  try { await writer.write(enc.encode(JSON.stringify(obj) + "\n")); } catch (err) { console.warn("write failed", err); }
}

let rx = new Uint8Array(0);
function onBytes(chunk) {
  const merged = new Uint8Array(rx.length + chunk.length);
  merged.set(rx); merged.set(chunk, rx.length); rx = merged;
  let i = 0;
  for (;;) {
    while (i + 1 < rx.length && !(rx[i] === 0xA5 && rx[i + 1] === 0x5A)) i++;
    if (i + 7 > rx.length) break;
    const type = rx[i + 2];
    const len = (rx[i + 3] | (rx[i + 4] << 8) | (rx[i + 5] << 16) | (rx[i + 6] << 24)) >>> 0;
    if (len > 200000) { i += 2; continue; }
    if (i + 7 + len > rx.length) break;
    const payload = rx.slice(i + 7, i + 7 + len);
    i += 7 + len;
    if (type === 1) onFrame(payload[0] | (payload[1] << 8), payload[2] | (payload[3] << 8), payload.subarray(4));
    else if (type === 2) { try { onMessage(JSON.parse(dec.decode(payload))); } catch (err) { console.warn("bad json", err); } }
  }
  rx = rx.slice(i);
}

$("btnConnect").onclick = async () => {
  if (mode === "serial") return disconnect();
  if (mode === "demo") stopDemo();
  try {
    // No filter: XIAO boards report Seeed's USB ID (0x2886), others Espressif's (0x303A).
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200, bufferSize: 65536 });
  } catch (err) {
    if (err.name !== "NotFoundError") alert("Couldn’t open the pad: " + err.message + ". Close any serial monitor using it and try again.");
    port = null; return;
  }
  try { await port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch {}
  mode = "serial";
  writer = port.writable.getWriter();
  setConn("Connected", "on");
  readLoop();
  helloSeen = false;
  send({ cmd: "hello" });
  clearTimeout(helloTimer);
  helloTimer = setTimeout(() => {
    if (mode === "serial" && !helloSeen) {
      setConn("Port open, pad not answering", "");
      alert("The port opened but nothing answered. Check that:\n\n• the Gesture Pad firmware is flashed (not the old demo)\n• Tools > USB CDC On Boot was Disabled and USB Mode was USB-OTG (TinyUSB) when you flashed\n• you picked the right port (unplug the pad and see which one disappears)");
    }
  }, 3000);
};
let helloSeen = false, helloTimer = null;
async function readLoop() {
  try {
    reader = port.readable.getReader();
    for (;;) { const { value, done } = await reader.read(); if (done) break; if (value) onBytes(value); }
  } catch (err) { console.warn("read ended", err); }
  finally { try { reader?.releaseLock(); } catch {} if (mode === "serial") disconnect(true); }
}
async function disconnect(lost = false) {
  if (!lost) { await send({ cmd: "stream", on: false }); await send({ cmd: "bye" }); }
  mode = "offline";
  try { await reader?.cancel(); } catch {}
  try { writer?.releaseLock(); } catch {}
  try { await port?.close(); } catch {}
  port = reader = writer = null;
  setConn(lost ? "Pad disconnected" : "Not connected", "");
  resetLive();
}
if ("serial" in navigator) navigator.serial.addEventListener("disconnect", e => { if (e.target === port) disconnect(true); });

function setConn(text, cls) {
  $("connText").textContent = text;
  $("connPill").className = "pill" + (cls ? " " + cls : "");
  $("btnConnect").textContent = mode === "serial" ? "Disconnect" : "Connect pad";
  $("btnDemo").textContent = mode === "demo" ? "Stop demo" : "Try demo";
  updateSaveUI();
  syncStream();
  if (selected === "camera") renderPanel();
}
const needsStream = () => ["camera", "tof"].includes(selected) || !!INPUTS[selected]?.gesture;
function syncStream() { if (mode !== "offline") send({ cmd: "stream", on: needsStream() || capture.on }); }

/* ===================================================================
   Messages from the pad
   =================================================================== */
function onMessage(msg) {
  switch (msg.type) {
    case "hello":
      helloSeen = true;
      setModelLabels(msg.labels || []);
      if (mode === "serial") setConn(`Connected, firmware ${msg.fw}${msg.tof ? "" : ", no distance sensor"}`, "on");
      break;
    case "config":
      cfg = withPoseDefaults({ map: { ...clone(DEFAULT_CONFIG.map), ...msg.config.map }, tune: { ...clone(DEFAULT_CONFIG.tune), ...msg.config.tune } });
      renderAll(); updateSaveUI();
      break;
    case "saved": dirty = false; updateSaveUI(); toast("Saved to the pad"); break;
    case "tel": onTelemetry(msg); break;
    case "input": onInputEvent(msg.id, msg.phase); break;
    case "reject": onReject(msg); break;
  }
}

function setModelLabels(labels) {

    let tel = { tof: 9999, raw: 0, st: 2, cov: .01, cx: .5, mc: 0, mv: 0, conf: 0, ratio: 1, palm: false, win: false, fps: 19.6 + Math.random() * .6,
      ml: [.92 - jit(), .05 + jit(), .03 + jit()], mlms: 142 + Math.round(Math.random() * 12), mlOn: !!t.mlOn };
    const s = this.sim;
    if (s) {
      const e = now - s.t0;
      if (["swipe_lr", "swipe_rl", "far"].includes(s.kind)) {
        const dur = 650, p = Math.min(1, e / dur), far = s.kind === "far";
        const x = (s.kind === "swipe_rl" ? 1 - p : p) * 220 - 30;
        const [n, sx] = this.blob(px, x, 68, far ? 22 : 60, far ? 28 : 75, 205);
        const cov = n / N, cx = n ? sx / n / (W - 1) : .5;
        const tof = far ? 380 + Math.round(Math.random() * 30) : 70 + Math.round(Math.random() * 12);
        const mc = muClose(tof, t), mv = muCover(cov, t);
        tel = { ...tel, tof, raw: tof + Math.round(Math.random() * 40 - 20), st: 0, cov, cx: t.mirror ? 1 - cx : cx, mc, mv, conf: Math.min(mc, mv), win: true };
        if (p >= 1 && !s.sent) {
          s.sent = true;
          if (far) this.emit({ type: "reject", id: "swipe", reason: "low_conf", value: 0 });
          else this.emit({ type: "input", id: t.mirror ? (s.kind === "swipe_lr" ? "swipe_rl" : "swipe_lr") : s.kind, phase: "tap" });
        }
        if (e > dur + 150) this.sim = null;
      } else if (s.kind === "palm") {
        if (e < 1800) {
          for (let i = 0; i < N; i++) px[i] = 14 + Math.random() * 10;
          tel = { ...tel, tof: 46, raw: 0, st: e > 200 ? 4 : 0, cov: .97, cx: .5, mc: 1, mv: 1, conf: 1, ratio: .14, palm: e >= t.palmHoldMs, win: true };
          if (e >= t.palmHoldMs && !s.down) { s.down = true; this.emit({ type: "input", id: "palm", phase: "down" }); }
        } else {
          if (s.down && !s.up) { s.up = true; this.emit({ type: "input", id: "palm", phase: "up" }); }
          if (e > 2000) this.sim = null;
        }
      } else if (s.kind === "peace") {
        const dur = 3000;
        if (e < dur) {
          let n = 0, sx = 0;
          const add = ([a, b]) => { n += a; sx += b; };
          add(this.blob(px, 82, 98, 26, 24, 196));                 // fist
          add(this.rect(px, 66, 30, 76, 86, 200));                 // index finger
          add(this.rect(px, 84, 34, 94, 86, 200));                 // middle finger
          const cov = n / N, tof = 260 + Math.round(Math.random() * 10);
          const ramp = Math.min(1, e / 400);
          tel = { ...tel, tof, raw: tof + Math.round(Math.random() * 30 - 15), st: 0, cov, cx: sx / n / (W - 1), mc: muClose(tof, t), mv: muCover(cov, t), win: true,
            ml: [.92 - .9 * ramp, .04 + jit(), .04 + .9 * ramp - jit()] };
          tel.conf = Math.min(tel.mc, tel.mv);
          if (e > t.swipeMaxMs + t.mlFrames * 150 && !s.down && t.mlOn) { s.down = true; this.emit({ type: "input", id: "ml_peace", phase: "down" }); }
        } else {
          if (s.down && !s.up) { s.up = true; this.emit({ type: "input", id: "ml_peace", phase: "up" }); }
          if (e > dur + 200) this.sim = null;
        }
      }
    }
    if (!this.streaming) return;
    onFrame(W, H, px);
    onTelemetry(tel);
  }
}
const muClose = (d, t) => d <= t.tofFull ? 1 : d >= t.tofZero ? 0 : (t.tofZero - d) / (t.tofZero - t.tofFull);
const muCover = (c, t) => c <= t.covLow ? 0 : c >= t.covHigh ? 1 : (c - t.covLow) / (t.covHigh - t.covLow);

$("btnDemo").onclick = () => {
  if (mode === "demo") return stopDemo();
  if (mode === "serial") disconnect();
  demo = new DemoDevice();
  mode = "demo"; dirty = false;
  setConn("Demo pad, nothing reaches your PC", "demo");
  demo.handle({ cmd: "hello" });
};
function stopDemo() {
  demo?.stop(); demo = null; mode = "offline";
  setModelLabels([]);
  setConn("Not connected", "");
  resetLive(); renderAll();
}

/* ===================================================================
   Init
   =================================================================== */
function renderAll() { renderBoard(); renderRails(); renderPanel(); }
if (!("serial" in navigator)) { $("noSerial").hidden = false; $("btnConnect").disabled = true; }
renderAll();
updateSaveUI();
</script>
